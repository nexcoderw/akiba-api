name: Verify Akiba API

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akiba-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DB_SOURCE_REVISION: ${{ vars.AKIBA_DB_SOURCE_REVISION }}
    steps:
      - name: Require a reviewed immutable database revision
        shell: bash
        run: |
          if [[ ! "$DB_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set AKIBA_DB_SOURCE_REVISION to the reviewed database commit containing the identity foundation."
            exit 1
          fi

      - name: Check out database package
        uses: actions/checkout@v4
        with:
          repository: nexcoderw/akiba-db
          ref: ${{ env.DB_SOURCE_REVISION }}
          token: ${{ secrets.DB_REPOSITORY_READ_TOKEN }}
          path: db

      - name: Check out API
        uses: actions/checkout@v4
        with:
          path: api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            api/package-lock.json

      - name: Build database dependency
        working-directory: db
        run: |
          npm ci --include=dev
          npm run prisma:generate
          npm run build

      - name: Install locked API dependencies
        working-directory: api
        run: npm ci --include=dev

      - name: Check formatting
        working-directory: api
        run: npm run format:check

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Type-check
        working-directory: api
        run: npm run typecheck

      - name: Run unit tests
        working-directory: api
        run: npm run test:unit

      - name: Run offline module integration tests
        working-directory: api
        run: npm run test:integration

      - name: Run HTTP contract tests
        working-directory: api
        run: npm run test:e2e

      - name: Build API
        working-directory: api
        run: npm run build
